name: Build and Publish

on:
  # run it on push to the default repository branch
  push:
    branches:
      - 'master'

  # run it during pull request
  pull_request:

env:
  APP_NAME: foo
  VERSION: 0.0.0
  APP_PATH: ./application
  OPS_PATH: ./gitops
  K8S_FILE: my-calibre-server/30-deployment-local.yaml

jobs:
  test:
    name: Run unit and e2e tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests (frontend + backend)
        run: npm run test
        env:
          # MyCalibreDbService's integration tests auto-detect and use this
          # instance instead of skipping themselves; see
          # apps/api/src/app/database/my-calibre-db.service.spec.ts
          MONGO_TEST_URL: mongodb://localhost:27017

      - name: Run Playwright e2e suite
        run: npm run e2e:playwright

  # define job to build and publish docker image
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    # run only when code is compiling and tests are passing
    needs: test
    runs-on: ubuntu-latest

    env: 
        actions_token: ${{ secrets.ACTIONS_TOKEN }}
        dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub_password: ${{ secrets.DOCKERHUB_TOKEN }}


    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: ${{env.APP_PATH}}

      - name: Checkout gitops
        uses: actions/checkout@v5
        if: ${{ env.actions_token != '' && github.ref == 'refs/heads/master' }}
        with:
          repository: bibulle/myKubernetesConfig
          token: ${{ env.actions_token }}
          path: ${{env.OPS_PATH}}

      - name: Read package.json
        id: read_package_json
        run: |
          echo "PACKAGE_JSON=$(jq -c . < ${{env.APP_PATH}}/package.json)" >> $GITHUB_ENV

      - name: Retrieve values from package.json
        id: retrieve_package_json
        run: |
          echo "APP_NAME=${{fromJson(env.PACKAGE_JSON).name}}" >> $GITHUB_ENV
          echo "VERSION=${{fromJson(env.PACKAGE_JSON).version}}" >> $GITHUB_ENV

      - name: Calculate docker tags
        if: ${{ env.dockerhub_username != '' && env.dockerhub_password != '' }}
        run : |
          echo "DOCKER_TAGS=${{env.dockerhub_username}}/${{env.APP_NAME}}:latest, ${{env.dockerhub_username}}/${{env.APP_NAME}}:V${{env.VERSION}}" >> $GITHUB_ENV

      - name: Calculate docker tags
        if: ${{ env.dockerhub_username == '' || env.dockerhub_password == '' }}
        run : |
          echo "DOCKER_TAGS=${{env.APP_NAME}}:latest" >> $GITHUB_ENV

      - run: |
          echo "Building : ${{env.APP_NAME}}:${{env.VERSION}}"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        id: login_dockerhub
        uses: docker/login-action@v4
        if: ${{ env.dockerhub_username != '' && env.dockerhub_password != '' }}
        with:
          username: ${{ env.dockerhub_username }}
          password: ${{ env.dockerhub_password }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ${{env.APP_PATH}}
          push: ${{ env.dockerhub_username != '' && env.dockerhub_password != '' && github.ref == 'refs/heads/master' }}
          tags: ${{env.DOCKER_TAGS}}

      - name: Update k8s yaml file
        id: update_yml
        if: ${{ env.actions_token != '' && github.ref == 'refs/heads/master' }}
        run: |
          cd ${{env.OPS_PATH}}
          image="bibulle\/${{env.APP_NAME}}"
          sed -i "s/image: ${image}:.*/image: ${image}:V${{env.VERSION}}/g" ${{env.K8S_FILE}}
          status=`git status -s | wc -l | bc`
          echo "line_modified=$status" >> $GITHUB_OUTPUT

      - name: Commit k8s yaml file
        id: commit_yml
        if: env.actions_token != '' && github.ref == 'refs/heads/master' && steps.update_yml.outputs.line_modified != '0'
        run: |
          cd ${{env.OPS_PATH}}
          git config --global user.email "${GITHUB_ACTOR}"
          git config --global user.name "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit -am "Update version of ${{env.APP_NAME}} (${{env.VERSION}})"
          git push
