@if (title) {
  <div class="title">{{title}}</div>
}
@for (ratingId of ratingArr; track ratingId; let i = $index) {
  <button mat-icon-button [color]="color" [id]="'star_'+i" (click)="onClick(i+1)" [matTooltip]="(1+ratingId).toString()" matTooltipPosition="above" [disabled]="disabled">
    <mat-icon>
      {{showIcon(i)}}
    </mat-icon>
  </button>
}
