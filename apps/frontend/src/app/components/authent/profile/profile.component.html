<div class="profile-page">
  <div class="back-link" (click)="goLibrary()">← {{ 'label.back-to-library' | translate }}</div>

  <div class="identity-banner">
    <span class="avatar">{{ initials() }}</span>
    <div class="identity-info">
      <h1>{{ displayName() }}</h1>
      <div class="meta">
        @if (user.local && user.local.username) {
          <span>&#64;{{ user.local.username }} · </span>
        }
        {{ 'label.member-since' | translate: { date: (user.created | localizedDate: 'MMMM y') } }}
      </div>
    </div>
    <div class="identity-actions">
      @if (isAdmin()) {
        <button type="button" class="pill pill-accent" (click)="openAdmin()">⚙ {{ 'label.administration' | translate }}</button>
      }
      <button type="button" class="pill pill-outline" (click)="logout()">{{ 'label.logout' | translate }}</button>
    </div>
  </div>

  <div class="cards-grid">
    <my-calibre-server-user-profile [user]="user" urlToRedirect="/profile">
      <my-calibre-server-change-password profile-password-slot></my-calibre-server-change-password>
    </my-calibre-server-user-profile>
  </div>
</div>
