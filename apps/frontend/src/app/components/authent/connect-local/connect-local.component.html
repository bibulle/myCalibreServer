<div class="connect-local-page">
  <div class="form-card">
    <form role="form" (submit)="connect($event, username.value, password.value)">
      <label class="field-label" for="connect-local-username">{{ 'label.username' | translate }}</label>
      <div class="field">
        <input id="connect-local-username" placeholder="{{ 'label.username' | translate }}" required #username autocomplete="username"/>
      </div>

      <label class="field-label" for="connect-local-password">{{ 'label.password' | translate }}</label>
      <div class="field">
        <input id="connect-local-password" placeholder="{{ 'label.password' | translate }}" required type="password" #password autocomplete="new-password"/>
      </div>

      <button type="submit" class="submit-btn">{{ 'label.connect-local-submit' | translate | uppercase }}</button>
    </form>
  </div>
</div>
