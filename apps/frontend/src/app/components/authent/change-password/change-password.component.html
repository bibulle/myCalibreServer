<section class="card">
  <div class="card-header">
    <div class="card-label">{{ 'label.password' | translate }}</div>
    @if (passwordsState === passwordsStateEnum.OK) {
      <span class="hint hint-ok">{{ 'label.password.ok' | translate }}</span>
    }
    @if (passwordsState === passwordsStateEnum.DIFFERENTS) {
      <span class="hint hint-error">{{ 'label.password.different' | translate }}</span>
    }
  </div>

  <form role="form" (submit)="save($event)">
    <label class="field-label" for="changepw-password1">{{ 'label.new-password' | translate }}
      <input id="changepw-password1" class="field-input" placeholder="••••••••" required type="password" name="password1" [(ngModel)]="password1" (change)="change()" (keyup)="change()" />
    </label>

    <label class="field-label" for="changepw-password2" [class.field-error]="passwordsState === passwordsStateEnum.DIFFERENTS">{{ 'label.confirm-password' | translate }}
      <input id="changepw-password2" class="field-input" [class.field-input-error]="passwordsState === passwordsStateEnum.DIFFERENTS" placeholder="••••••••" required type="password" name="password2" [(ngModel)]="password2" (change)="change()" (keyup)="change()" />
    </label>

    <div class="actions">
      <button type="submit" class="submit-btn" [disabled]="passwordsState !== passwordsStateEnum.OK">{{ 'label.changepw' | translate }}</button>
    </div>
  </form>
</section>
