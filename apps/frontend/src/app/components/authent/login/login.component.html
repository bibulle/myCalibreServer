<div class="auth-page">
  <div class="auth-container">
    <div class="brand">
      <span class="logo-mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff5ee" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.5C10.6 5.4 8.6 4.8 6 4.8c-1.1 0-2.1.1-3 .3v13.4c.9-.2 1.9-.3 3-.3 2.6 0 4.6.6 6 1.7"/>
          <path d="M12 6.5c1.4-1.1 3.4-1.7 6-1.7 1.1 0 2.1.1 3 .3v13.4c-.9-.2-1.9-.3-3-.3-2.6 0-4.6.6-6 1.7z"/>
          <path d="M12 6.5V20"/>
        </svg>
      </span>
      <div class="brand-title">
        <span class="brand-name">{{ 'title' | translate }}</span>
        @if (version.version) {
          <span class="brand-version">
            v{{ version.version }}
            @if (isVersionBeta()) {
              <span class="beta">{{ 'label.beta' | translate }}</span>
            }
          </span>
        }
      </div>
      <div class="tagline">{{ 'label.login-tagline' | translate }}</div>
    </div>

    <div class="auth-card">
      <form role="form" (submit)="login($event, username.value, password.value)">
        <label class="field-label" for="login-username">{{ 'label.username' | translate }}</label>
        <div class="field">
          <span class="field-icon">◍</span>
          <input id="login-username" placeholder="{{ 'label.username' | translate }}" required #username autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="username"/>
        </div>

        <label class="field-label" for="login-password">{{ 'label.password' | translate }}</label>
        <div class="field">
          <span class="field-icon">⚿</span>
          <input id="login-password" placeholder="{{ 'label.password' | translate }}" required type="password" #password autocomplete="current-password"/>
        </div>

        <button type="submit" class="submit-btn">{{ 'label.login' | translate | uppercase }}</button>

        <div class="divider">
          <span class="line"></span>
          <span class="divider-text">{{ 'label.continue-with' | translate }}</span>
          <span class="line"></span>
        </div>

        <div class="oauth-row">
          <button type="button" class="oauth-btn" (click)="startLoginGoogle()">
            <svg width="17" height="17" viewBox="0 0 48 48">
              <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
              <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
              <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
              <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            <span>{{ 'label.google' | translate }}</span>
          </button>
          <button type="button" class="oauth-btn" (click)="startLoginFacebook()">
            <svg width="17" height="17" viewBox="0 0 24 24">
              <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            <span>{{ 'label.facebook' | translate }}</span>
          </button>
        </div>
      </form>
    </div>

    <div class="switch-auth">
      {{ 'label.no-account' | translate }} <span class="link" (click)="signup()">{{ 'label.create-account' | translate }}</span>
    </div>
  </div>
</div>
