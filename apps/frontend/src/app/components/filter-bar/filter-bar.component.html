@if (!filter.not_displayed) {
  <div class="rl-toolbar-actions">
    <button type="button" class="sort-toggle" [matMenuTriggerFor]="sortmenu">
      {{ 'label.sort-by' | translate }}: {{ sortLabel | translate }} ▾
    </button>
    <mat-menu xPosition="before" yPosition="below" #sortmenu="matMenu" class="sort-menu">
      @if (filter.isAvailable(0)) {
        <button mat-menu-item (click)="toggleSort(0)" [class.active]="filter.sort === 0">
          <span>{{ 'label.name' | translate }}</span>
          @if (filter.sort === 0) {
            <mat-icon>{{ filter.sorting_direction === 0 ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
          }
        </button>
      }
      @if (filter.isAvailable(1)) {
        <button mat-menu-item (click)="toggleSort(1)" [class.active]="filter.sort === 1">
          <span>{{ 'label.publish_date' | translate }}</span>
          @if (filter.sort === 1) {
            <mat-icon>{{ filter.sorting_direction === 0 ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
          }
        </button>
      }
      @if (filter.isAvailable(2)) {
        <button mat-menu-item (click)="toggleSort(2)" [class.active]="filter.sort === 2">
          <span>{{ 'label.author' | translate }}</span>
          @if (filter.sort === 2) {
            <mat-icon>{{ filter.sorting_direction === 0 ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
          }
        </button>
      }
      @if (filter.isAvailable(3)) {
        <button mat-menu-item (click)="toggleSort(3)" [class.active]="filter.sort === 3">
          <span>{{ 'label.rating-public' | translate }}</span>
          @if (filter.sort === 3) {
            <mat-icon>{{ filter.sorting_direction === 0 ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
          }
        </button>
      }
      @if (filter.isAvailable(4)) {
        <button mat-menu-item (click)="toggleSort(4)" [class.active]="filter.sort === 4">
          <span>{{ 'label.rating-reader' | translate }}</span>
          @if (filter.sort === 4) {
            <mat-icon>{{ filter.sorting_direction === 0 ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
          }
        </button>
      }
    </mat-menu>

    <div class="lang-toggle">
      <span [class.active]="filter.isLangSelected(1)" (click)="toggleLang(1)">{{ 'label.french-short' | translate }}</span>
      <span [class.active]="filter.isLangSelected(2)" (click)="toggleLang(2)">{{ 'label.english-short' | translate }}</span>
    </div>
  </div>
}
