@if (series) {
  <mat-content>
    @for (serie of series; track serie) {
      <my-calibre-server-series-card [series]="serie" [booksClosed]="serie.series_id !== selectedId">
      </my-calibre-server-series-card>
    }
    @if (series.length === MAX_SERIES) {
      <div class="max-reached">
        <span>{{ 'label.limited' | translate:param }}</span>
      </div>
    }
  </mat-content>
}
@if (!series) {
  <mat-spinner></mat-spinner>
}
