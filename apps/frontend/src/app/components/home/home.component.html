@if (books) {
  <mat-card class="new-book">
    <mat-card-title class="title">{{ 'label.news' | translate : param }}</mat-card-title>
    @for (book of books; track book) {
      <my-calibre-server-book-card [book]="book"> </my-calibre-server-book-card>
    }
  </mat-card>
}
@if (!books) {
  <mat-spinner></mat-spinner>
}
