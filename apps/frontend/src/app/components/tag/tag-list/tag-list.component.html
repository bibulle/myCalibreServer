@if (tags) {
  <mat-content>
    @for (tag of tags; track tag) {
      <my-calibre-server-tag-card [tag]="tag" [booksClosed]="tag.tag_id !== selectedId">
      </my-calibre-server-tag-card>
    }
    @if (tags.length === MAX_TAGS) {
      <div class="max-reached">
        <span>{{ 'label.limited' | translate:param }}</span>
      </div>
    }
  </mat-content>
}
@if (!tags) {
  <mat-content class="spinner">
    <mat-spinner></mat-spinner>
  </mat-content>
}
