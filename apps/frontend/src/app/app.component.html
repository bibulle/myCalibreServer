@if (!hideHeader) {
  <header class="app-header">
    <div class="bar">
      <a class="logo" routerLink="/">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff5ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.5C10.6 5.4 8.6 4.8 6 4.8c-1.1 0-2.1.1-3 .3v13.4c.9-.2 1.9-.3 3-.3 2.6 0 4.6.6 6 1.7"/>
            <path d="M12 6.5c1.4-1.1 3.4-1.7 6-1.7 1.1 0 2.1.1 3 .3v13.4c-.9-.2-1.9-.3-3-.3-2.6 0-4.6.6-6 1.7z"/>
            <path d="M12 6.5V20"/>
          </svg>
        </span>
        <span class="logo-text">
          <span class="logo-name">{{ 'title' | translate }}</span>
          @if (version.version) {
            <span class="logo-version">v{{ version.version }} @if (isVersionBeta()) {
              <span class="beta">beta</span>
            }</span>
          }
        </span>
      </a>

      @if (user?.id) {
        <nav class="nav-tabs">
          @for (l of links; track l.label) {
            <a routerLinkActive="active" routerLink="{{ l.path }}" (click)="onNavItemClick()">{{ l.label | translate }}</a>
          }
        </nav>
      }

      <span class="spacer"></span>

      <div class="search">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          [ngModel]="filter.search"
          (ngModelChange)="onSearchChange($event)"
          placeholder="{{ 'label.search' | translate }}"
        />
      </div>

      <button type="button" class="theme-toggle" (click)="toggleTheme()" [matTooltip]="(themeService.isDark() ? 'label.theme-light' : 'label.theme-dark') | translate">
        @if (themeService.isDark()) {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        }
      </button>

      <my-calibre-server-profile-button class="avatar"></my-calibre-server-profile-button>
    </div>
  </header>

  @if (title.title) {
    <div class="page-title-bar">
      @if (title.backUrl) {
        <button mat-icon-button (click)="goBack()" aria-label="Back">
          <mat-icon>arrow_back</mat-icon>
        </button>
      }
      <h1>{{ title.title | translate }}</h1>
    </div>
  }
}

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<my-calibre-server-docs-footer></my-calibre-server-docs-footer>
