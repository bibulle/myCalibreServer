@if (!hideHeader) {
  <header class="app-header">
    <div class="bar">
      <a class="logo" routerLink="/">
        <span class="logo-mark"></span>
        {{ 'title' | translate }}
      </a>

      @if (user?.id) {
        <nav class="nav-tabs">
          @for (l of links; track l.label) {
            <a routerLinkActive="active" routerLink="{{ l.path }}" (click)="onNavItemClick()">{{ l.label | translate }}</a>
          }
        </nav>
      }

      @if (!filter.not_displayed) {
        <div class="search">
          <my-calibre-server-filter-bar></my-calibre-server-filter-bar>
        </div>
      }

      <button mat-icon-button type="button" class="theme-toggle" (click)="toggleTheme()" [matTooltip]="(themeService.isDark() ? 'label.theme-light' : 'label.theme-dark') | translate">
        <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <my-calibre-server-profile-button class="avatar"></my-calibre-server-profile-button>
    </div>
  </header>

  @if (title.title) {
    <div class="page-title-bar">
      @if (title.backUrl) {
        <button mat-icon-button (click)="goBack()" aria-label="Back">
          <mat-icon>arrow_back</mat-icon>
        </button>
      }
      <h1>{{ title.title | translate }}</h1>
    </div>
  }
}

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<my-calibre-server-docs-footer></my-calibre-server-docs-footer>
